<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace">
  <title>Résumé sync pipeline: weekly change detection, agent review, CI build and pull requests that I merge</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#0b0b0b"/>

  <g fill="#0b0b0b" stroke="#7a7a7a" stroke-width="1.5">
    <rect x="40" y="50" width="250" height="100" rx="4"/>
    <rect x="330" y="50" width="250" height="100" rx="4"/>
    <rect x="620" y="50" width="250" height="100" rx="4"/>
    <rect x="910" y="50" width="250" height="100" rx="4"/>
    <rect x="910" y="290" width="250" height="100" rx="4"/>
    <rect x="620" y="290" width="250" height="100" rx="4"/>
    <rect x="40" y="290" width="250" height="100" rx="4"/>
  </g>
  <rect x="330" y="290" width="250" height="100" rx="4" fill="#0b0b0b" stroke="#e5484d" stroke-width="2"/>

  <g stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M290 100H326"/>
    <path d="M580 100H616"/>
    <path d="M870 100H906"/>
    <path d="M1035 150V286"/>
    <path d="M910 340H874"/>
    <path d="M620 340H584"/>
    <path d="M330 340H294"/>
  </g>
  <path d="M455 150V196" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#a)"/>

  <g text-anchor="middle" font-size="17" fill="#f2f2f2" font-weight="600">
    <text x="165" y="85">Weekly schedule</text>
    <text x="455" y="85">check.py</text>
    <text x="745" y="85">Agent review</text>
    <text x="1035" y="85">Edit resume.tex</text>
    <text x="1035" y="325">GitHub Action</text>
    <text x="745" y="325">Pull request</text>
    <text x="455" y="325" fill="#e5484d">I review + merge</text>
    <text x="165" y="325">Website PDF PR</text>
  </g>
  <g text-anchor="middle" font-size="13.5" fill="#a8a8a8">
    <text x="165" y="110">Sundays 06:00,</text>
    <text x="165" y="130">cloud agent</text>
    <text x="455" y="110">diff repos since last</text>
    <text x="455" y="130">review, skip own files</text>
    <text x="745" y="110">rules in SYNC.md,</text>
    <text x="745" y="130">every claim needs a source</text>
    <text x="1035" y="110">on a new branch,</text>
    <text x="1035" y="130">never on main</text>
    <text x="1035" y="350">compile LaTeX, fail</text>
    <text x="1035" y="370">if &gt; 1 page, PDF</text>
    <text x="745" y="350">before → after,</text>
    <text x="745" y="370">with source commits</text>
    <text x="455" y="350">nothing goes live</text>
    <text x="455" y="370">without this step</text>
    <text x="165" y="350">opened next run;</text>
    <text x="165" y="370" fill="#e5484d">I merge, site updates</text>
    <text x="455" y="222">nothing changed: stop, no commits</text>
  </g>
  <text x="600" y="440" text-anchor="middle" font-size="13" fill="#7a7a7a">grey = automated · red = human step</text>
</svg>
